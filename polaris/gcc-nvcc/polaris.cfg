VERSION = polaris-2026-08-12-gnu12.3-cuda12.9-boost1.89-r4

CPP  = cpp
FPP  = cpp
CC   = cc
CXX  = CC
F90  = ftn
CUCC = nvcc
LD   = nvcc --compiler-bindir g++ --gpu-architecture sm_80 --forward-unknown-to-host-compiler --relocatable-device-code=true --objdir-as-tempdir

CPPFLAGS = -DSIMD_CPU
FPPFLAGS = -traditional -march=native
CFLAGS   = -pipe -g -D_GNU_SOURCE -fomit-frame-pointer
CXXFLAGS = -pipe -g -std=c++17 -D_GNU_SOURCE -fomit-frame-pointer
F90FLAGS = -pipe -g -fcray-pointer -ffixed-line-length-none -fno-range-check -march=native -fomit-frame-pointer
CUCCFLAGS = -pipe -g --compiler-options -march=native -std=c++17 --compiler-options -std=gnu++17 --expt-relaxed-constexpr --extended-lambda --gpu-architecture sm_80 --forward-unknown-to-host-compiler --Werror ext-lambda-captures-this --relocatable-device-code=true --objdir-as-tempdir -I${ETKPATH}/boost-gcc-nvcc/include --pre-include ${ETKPATH}/boost-gcc-nvcc/include/boost/math/tools/toms748_solve.hpp -x cu

LIBS = gfortran curand mpi_gtl_cuda
LIBDIRS = /opt/nvidia/hpc_sdk/Linux_x86_64/25.5/cuda/12.9/lib64 /opt/nvidia/hpc_sdk/Linux_x86_64/25.5/math_libs/12.9/targets/x86_64-linux/lib
C_LINE_DIRECTIVES = yes
F_LINE_DIRECTIVES = yes

VECTORISE = yes
VECTORISE_ALIGNED_ARRAYS = yes
VECTORISE_INLINE = yes
DEBUG = no
OPTIMISE = yes
C_OPTIMISE_FLAGS = -O3
CXX_OPTIMISE_FLAGS = -O3
CUCC_OPTIMISE_FLAGS = -O3
F90_OPTIMISE_FLAGS = -O3
OPENMP = no
WARN = no
DISABLE_INT16 = yes
DISABLE_REAL16 = yes

AMREX_DIR = BUILD
AMREX_ENABLE_CUDA = yes
AMREX_CMAKE_CUDA_ARCHITECTURES = 80
MPI_DIR = ${CRAY_MPICH_DIR}
MPI_INC_DIRS = ${CRAY_MPICH_DIR}/include
MPI_LIB_DIRS = ${CRAY_MPICH_DIR}/lib
MPI_LIBS = mpi
BOOST_DIR = ${ETKPATH}/boost-gcc-nvcc
BOOST_LIBS = boost_filesystem
BLAS_DIR = BUILD
LAPACK_DIR = BUILD
GSL_DIR = BUILD
LORENE_DIR = /home/jkalinan/Lorene
HWLOC_DIR = BUILD
HWLOC_EXTRA_LIBS = udev
FFTW3_DIR = ${FFTW_ROOT}
HDF5_DIR = ${HDF5_ROOT}
