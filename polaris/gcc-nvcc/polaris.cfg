VERSION = polaris-2026-09-25-gnu14-cuda13.0-amrex26.09-BHC-opt

CPP  = cpp
FPP  = cpp
CC   = cc
CXX  = CC
F90  = ftn
CUCC = nvcc
LD   = nvcc --compiler-bindir g++ --gpu-architecture sm_80 --forward-unknown-to-host-compiler --relocatable-device-code=true --objdir-as-tempdir
LDFLAGS = -Wl,--disable-new-dtags

CPPFLAGS = -DSIMD_CPU
FPPFLAGS = -traditional -march=native
# Polaris's GCC 14 package ships a stale include-fixed bits/floatn.h.  Load the
# matching system header first so C dependencies using <tgmath.h> (notably
# bundled SSHT) see the complete glibc floating-point feature definitions.
CFLAGS   = -pipe -g -std=gnu17 -D_GNU_SOURCE -include /usr/include/bits/floatn.h -fomit-frame-pointer
CXXFLAGS = -pipe -g -std=c++20 -D_GNU_SOURCE -fomit-frame-pointer
F90FLAGS = -pipe -g -fcray-pointer -ffixed-line-length-none -fno-range-check -march=native -fomit-frame-pointer
CUCCFLAGS = -pipe -g --compiler-options -march=znver3 -std=c++20 --compiler-options -std=gnu++20 --expt-relaxed-constexpr --extended-lambda --gpu-architecture sm_80 --forward-unknown-to-host-compiler --Werror ext-lambda-captures-this --relocatable-device-code=true --objdir-as-tempdir -Drestrict=__restrict__ -I/home/jkalinan/EinsteinToolkit/boost-gcc-nvcc/include --pre-include /home/jkalinan/EinsteinToolkit/boost-gcc-nvcc/include/boost/math/tools/toms748_solve.hpp -x cu

LIBS = gfortran curand gomp mpi_gtl_cuda m
LIBDIRS = /opt/nvidia/hpc_sdk/Linux_x86_64/25.9/cuda/13.0/targets/x86_64-linux/lib /opt/nvidia/hpc_sdk/Linux_x86_64/25.9/math_libs/13.0/targets/x86_64-linux/lib /opt/nvidia/hpc_sdk/Linux_x86_64/25.9/compilers/lib
C_LINE_DIRECTIVES = yes
F_LINE_DIRECTIVES = yes

VECTORISE = yes
VECTORISE_ALIGNED_ARRAYS = yes
VECTORISE_INLINE = yes
DEBUG = no
OPTIMISE = yes
CPP_OPTIMISE_FLAGS = -DNDEBUG
C_OPTIMISE_FLAGS = -O3
CXX_OPTIMISE_FLAGS = -O3
CUCC_OPTIMISE_FLAGS = -O3
F90_OPTIMISE_FLAGS = -O3
OPENMP = yes
CUCC_OPENMP_FLAGS = --compiler-options -fopenmp
WARN = no
DISABLE_INT16 = yes
DISABLE_REAL16 = yes

AMREX_DIR = /home/jkalinan/EinsteinToolkit/amrex-gcc-nvcc
AMREX_ENABLE_CUDA = yes
AMREX_CMAKE_CUDA_ARCHITECTURES = 80
ADIOS2_USE_EXTERNAL_YAMLCPP = yes
MPI_DIR = /opt/cray/pe/mpich/9.1.0/ofi/gnu/12.3
MPI_INC_DIRS = /opt/cray/pe/mpich/9.1.0/ofi/gnu/12.3/include
MPI_LIB_DIRS = /opt/cray/pe/mpich/9.1.0/ofi/gnu/12.3/lib
MPI_LIBS = mpi
BOOST_DIR = /home/jkalinan/EinsteinToolkit/boost-gcc-nvcc
BOOST_LIBS = boost_filesystem
BLAS_DIR = BUILD
LAPACK_DIR = BUILD
GSL_DIR = BUILD
HWLOC_DIR = BUILD
HWLOC_EXTRA_LIBS = udev
FFTW3_DIR = /opt/cray/pe/fftw/3.3.10.11/x86_milan
HDF5_DIR = /opt/cray/pe/hdf5-parallel/1.14.3.9/gnu/12.3
