[polaris]
nickname = polaris
name = Polaris
location = ALCF
description = ALCF Polaris GPU cluster
webpage = https://docs.alcf.anl.gov/polaris/
status = production
user = jkalinan
email = jkalinan@illinois.edu
hostname = polaris.alcf.anl.gov
aliaspattern = ^polaris-login-[0-9]+(\.hsn\.cm\.polaris\.alcf\.anl\.gov)?$
envsetup = <<EOT
module reset &&
module load gcc-native/12.3 &&
module load cuda/12.9 &&
module load craype-accel-nvidia80 &&
module load cray-hdf5-parallel/1.14.3.7 &&
module load cray-fftw/3.3.10.11 &&
export MPICH_GPU_SUPPORT_ENABLED=1 &&
export PATH=/home/@USER@/EinsteinToolkit/cmake/bin:$PATH
EOT
sourcebasedir = /home/@USER@/EinsteinToolkit
optionlist = polaris.cfg
submitscript = polaris.sub
runscript = polaris.run
makejobs = 4
make = make -j@MAKEJOBS@
basedir = /eagle/@ALLOCATION@/usr/@USER@/simulations
cpu = AMD EPYC Milan
ppn = 64
spn = 4
mpn = 4
max-num-smt = 1
num-smt = 1
max-num-threads = 64
num-threads = 16
memory = 500000
nodes = 560
min-ppn = 64
allocation = ATPESC2026
queue = preemptable
maxwalltime = 24:00:00
submit = qsub @SCRIPTFILE@
getstatus = qstat @JOB_ID@
stop = qdel @JOB_ID@
submitpattern = ([0-9]+)\.polaris-pbs-01
statuspattern = ^@JOB_ID@
queuedpattern = ' Q '
runningpattern = ' R '
holdingpattern = ' H '
exechost = hostname
exechostpattern = ^(\S+)
stdout = cat @SIMULATION_NAME@.out
stderr = cat @SIMULATION_NAME@.err
stdout-follow = tail -n 100 -f @SIMULATION_NAME@.out @SIMULATION_NAME@.err
