# TACC Horizon Grace Blackwell nodes (GB200, sm_100)
# Whenever this version string changes, the application is configured
# and rebuilt from scratch

VERSION = horizon-gcc-nvcc-2026-11-19

CPP  = cpp
FPP  = cpp
CC   = gcc
CXX  = g++
F90  = gfortran
CUCC = nvcc

# subset CUCCFLAGS without "-x cu" (must no be used here) and options used only to compile code
# must set LD and not LDFLAGS to avoid ExternalLibraries picking up the options
# device linking must target the same GPU as the CUDA objects
LD = nvcc --compiler-bindir g++ -g --forward-unknown-to-host-compiler --relocatable-device-code=true --objdir-as-tempdir --gpu-architecture sm_100

CPPFLAGS = -DSIMD_CPU
FPPFLAGS = -traditional
CFLAGS    = -D_GNU_SOURCE -fomit-frame-pointer
CXXFLAGS  = -std=c++20 -D_GNU_SOURCE -fomit-frame-pointer
F90FLAGS  = -ffixed-line-length-none -fno-range-check -fomit-frame-pointer
CUCCFLAGS = -pipe -g --compiler-bindir g++ --compiler-options -mcpu=neoverse-v2 -std=c++20 --compiler-options -std=gnu++20 --expt-relaxed-constexpr --extended-lambda --gpu-architecture sm_100 --forward-unknown-to-host-compiler --Werror ext-lambda-captures-this --relocatable-device-code=true --objdir-as-tempdir -x cu

# The CUDA module puts cuRAND and cuSPARSE in the NVIDIA math library tree.
SYS_INC_DIRS = ${TACC_CUDA_INC} ${TACC_CUDA_INC}/cccl ${TACC_CUDA_INC}/nvtx3 ${TACC_NVIDIA_MATH_INC}
LIBDIRS      = ${TACC_CUDA_LIB} ${TACC_NVIDIA_MATH_LIB}
LIBS         = gfortran curand cusparse
LDFLAGS      = -Wl,-rpath,${ETKPATH}/silo-horizon-gcc-nvcc/lib

C_LINE_DIRECTIVES = yes
F_LINE_DIRECTIVES = yes

VECTORISE = no  # carpet vectorise thorn

DEBUG            = no
CPP_DEBUG_FLAGS  = -g -DCARPET_DEBUG
FPP_DEBUG_FLAGS  = -g -DCARPET_DEBUG
C_DEBUG_FLAGS    = -g -ftrapv -fstack-protector-all -fbounds-check
CXX_DEBUG_FLAGS  = -g -ftrapv -fstack-protector-all -fbounds-check
F90_DEBUG_FLAGS  = -g -ftrapv -fstack-protector-all -fcheck=bounds,do,mem,pointer,recursion -finit-character=65 -finit-integer=42424242 -finit-real=nan

OPTIMISE            = yes
CPP_OPTIMISE_FLAGS  = # -DCARPET_OPTIMISE -DNDEBUG
FPP_OPTIMISE_FLAGS  = # -DCARPET_OPTIMISE -DNDEBUG
C_OPTIMISE_FLAGS    = -O3 -mcpu=neoverse-v2
CXX_OPTIMISE_FLAGS  = -O3 -mcpu=neoverse-v2
F90_OPTIMISE_FLAGS  = -O3 -mcpu=neoverse-v2

PROFILE           = no
CPP_PROFILE_FLAGS =
FPP_PROFILE_FLAGS =
C_PROFILE_FLAGS   = -pg
CXX_PROFILE_FLAGS = -pg
F90_PROFILE_FLAGS = -pg

OPENMP           = no

WARN            = no
CPP_WARN_FLAGS  = -Wall
FPP_WARN_FLAGS  = -Wall
C_WARN_FLAGS    = -Wall
CXX_WARN_FLAGS  = -Wall
F90_WARN_FLAGS  = -Wall

# CUDA does not support these
DISABLE_INT16  = yes
DISABLE_REAL16 = yes

# More Options

AMREX_DIR = ${ETKPATH}/amrex-horizon-gcc-nvcc
AMREX_ENABLE_CUDA = yes

MPI_DIR      = ${TACC_MPI_DIR}
MPI_INC_DIRS = ${TACC_MPI_DIR}/include
MPI_LIB_DIRS = ${TACC_MPI_DIR}/lib
MPI_LIBS     = mpi

HWLOC_DIR      = /usr
HWLOC_LIB_DIRS = /usr/lib64

BLAS_DIR        = ${TACC_NVPL_DIR}
BLAS_INC_DIRS   = ${TACC_NVPL_INC}
BLAS_LIB_DIRS   = ${TACC_NVPL_LIB}
BLAS_LIBS       = nvpl_blas_lp64_gomp

LAPACK_DIR      = ${TACC_NVPL_DIR}
LAPACK_INC_DIRS = ${TACC_NVPL_INC}
LAPACK_LIB_DIRS = ${TACC_NVPL_LIB}
LAPACK_LIBS     = nvpl_lapack_lp64_gomp

# Use Horizon's system serial HDF5 for Cactus and the separate Silo build.
HDF5_DIR      = /usr
HDF5_INC_DIRS = /usr/include
HDF5_LIB_DIRS = /usr/lib64
HDF5_LIBS     = hdf5_hl hdf5

BOOST_DIR      = /usr
BOOST_LIB_DIRS = /usr/lib64
ZLIB_DIR       = /usr
ZLIB_LIB_DIRS  = /usr/lib64

SILO_DIR     = ${ETKPATH}/silo-horizon-gcc-nvcc
FFTW3_DIR    = BUILD
GSL_DIR      = BUILD
ADIOS2_DIR   = BUILD
OPENPMD_DIR  = BUILD
YAML_CPP_DIR = BUILD
