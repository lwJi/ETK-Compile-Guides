# Cactus option list for RIT tigris, GH200 nodes (Grace CPU + H100, sm_90)
# gcc 13.2.0 + CUDA 12.8.0 + OpenMPI 4.1.6, all from the central Spack tree.
# Requires: source ${ETKGUIDE}/gcc13-nvcc/Load-Module-CarpetX  (sets ETK_*_DIR)
#
# Whenever this version string changes, the application is configured
# and rebuilt from scratch

VERSION = tigris-gcc13-nvcc-2026-11-03

CPP  = cpp
FPP  = cpp
CC   = gcc
CXX  = g++
F90  = gfortran
CUCC = nvcc

# subset CUCCFLAGS without "-x cu" (must no be used here) and options used only to compile code
# must set LD and not LDFLAGS to avoid ExternalLibraries picking up the options
# --gpu-architecture is required here: with -rdc the final device link happens
# at this step, and without it nvcc links for its default (sm_52) only
LD = nvcc --compiler-bindir g++ -g --forward-unknown-to-host-compiler --relocatable-device-code=true --objdir-as-tempdir --gpu-architecture sm_90

CPPFLAGS = -DSIMD_CPU
FPPFLAGS = -traditional
CFLAGS    = -D_GNU_SOURCE -fomit-frame-pointer
CXXFLAGS  = -std=c++20 -D_GNU_SOURCE -fomit-frame-pointer
F90FLAGS  = -ffixed-line-length-none -fno-range-check -fomit-frame-pointer
CUCCFLAGS = -pipe -g --compiler-bindir g++ --compiler-options -mcpu=neoverse-v2 -std=c++20 --compiler-options -std=gnu++20 --expt-relaxed-constexpr --extended-lambda --gpu-architecture sm_90 --forward-unknown-to-host-compiler --Werror ext-lambda-captures-this --relocatable-device-code=true --objdir-as-tempdir -x cu

# gcc 13's libstdc++ is newer than the system one: bake in rpaths so the
# executable does not depend on LD_LIBRARY_PATH for these
LDFLAGS = -L${ETK_CUDA_DIR}/lib64 -Wl,-rpath,${ETK_CUDA_DIR}/lib64 -Wl,-rpath,${ETK_GCC_DIR}/lib64

LIBDIRS      = ${ETK_CUDA_DIR}/lib64
# AMReX (CUDA) needs curand and, since ~26.x (SpMatrix/SpGEMM), cusparse
LIBS         = gfortran nvToolsExt curand cusparse

C_LINE_DIRECTIVES = yes
F_LINE_DIRECTIVES = yes

VECTORISE = no  # carpet vectorise thorn

DEBUG            = no
CPP_DEBUG_FLAGS  = -g -DCARPET_DEBUG
FPP_DEBUG_FLAGS  = -g -DCARPET_DEBUG
C_DEBUG_FLAGS    = -g -ftrapv -fstack-protector-all -fbounds-check
CXX_DEBUG_FLAGS  = -g -ftrapv -fstack-protector-all -fbounds-check
F90_DEBUG_FLAGS  = -g -ftrapv -fstack-protector-all -fcheck=bounds,do,mem,pointer,recursion -finit-character=65 -finit-integer=42424242 -finit-real=nan

OPTIMISE            = yes
CPP_OPTIMISE_FLAGS  = # -DCARPET_OPTIMISE -DNDEBUG
FPP_OPTIMISE_FLAGS  = # -DCARPET_OPTIMISE -DNDEBUG
C_OPTIMISE_FLAGS    = -O3 -mcpu=neoverse-v2
CXX_OPTIMISE_FLAGS  = -O3 -mcpu=neoverse-v2
F90_OPTIMISE_FLAGS  = -O3 -mcpu=neoverse-v2

PROFILE           = no
CPP_PROFILE_FLAGS =
FPP_PROFILE_FLAGS =
C_PROFILE_FLAGS   = -pg
CXX_PROFILE_FLAGS = -pg
F90_PROFILE_FLAGS = -pg

OPENMP           = no

WARN            = no
CPP_WARN_FLAGS  = -Wall
FPP_WARN_FLAGS  = -Wall
C_WARN_FLAGS    = -Wall
CXX_WARN_FLAGS  = -Wall
F90_WARN_FLAGS  = -Wall

# CUDA does not support these
DISABLE_INT16  = yes
DISABLE_REAL16 = yes

# ---------------- External libraries ----------------

AMREX_DIR = ${ETKPATH}/amrex-lib-gcc13-nvcc
AMREX_ENABLE_CUDA = yes

MPI_DIR      = ${ETK_MPI_DIR}
MPI_INC_DIRS = ${ETK_MPI_DIR}/include
MPI_LIB_DIRS = ${ETK_MPI_DIR}/lib
# Spack OpenMPI is built with --enable-mpi-cxx, so C++ code including mpi.h
# (e.g. openPMD) references MPI:: symbols from libmpi_cxx
MPI_LIBS     = mpi_cxx mpi

# use the hwloc OpenMPI was built against
HWLOC_DIR      = ${ETK_HWLOC_DIR}
HWLOC_INC_DIRS = ${ETK_HWLOC_DIR}/include
HWLOC_LIB_DIRS = ${ETK_HWLOC_DIR}/lib
HWLOC_LIBS     = hwloc

BLAS_DIR        = ${ETK_OPENBLAS_DIR}
BLAS_INC_DIRS   = ${ETK_OPENBLAS_DIR}/include
BLAS_LIB_DIRS   = ${ETK_OPENBLAS_DIR}/lib
BLAS_LIBS       = openblas

LAPACK_DIR      = ${ETK_OPENBLAS_DIR}
LAPACK_INC_DIRS = ${ETK_OPENBLAS_DIR}/include
LAPACK_LIB_DIRS = ${ETK_OPENBLAS_DIR}/lib
LAPACK_LIBS     = openblas

BOOST_DIR  = ${ETK_BOOST_DIR}
BOOST_LIBS = boost_filesystem

FFTW3_DIR = ${ETK_FFTW3_DIR}
GSL_DIR   = ${ETK_GSL_DIR}

# Parallel HDF5. hdf5.h includes mpi.h, so the MPI include dir is listed here
# too; this lets the bundled Silo build against parallel HDF5 without patching
# its build.sh (on Vista a separate serial HDF5 was needed instead).
HDF5_DIR      = ${ETK_HDF5_DIR}
HDF5_INC_DIRS = ${ETK_HDF5_DIR}/include ${ETK_MPI_DIR}/include
HDF5_LIB_DIRS = ${ETK_HDF5_DIR}/lib
HDF5_LIBS     = hdf5_hl hdf5

ZLIB_DIR = /usr

# Silo: prebuilt by ${ETKGUIDE}/gcc13-nvcc/Install-Silo (same tarball the
# thorn ships). The thorn's own build (SILO_DIR = BUILD) fails: its build.sh
# passes LIBS with a leading space to link_libraries(), which CMake rejects
# (policy CMP0004).
SILO_DIR     = ${ETKPATH}/silo-lib-gcc13

# Not available in Spack for neoverse_v2 with this MPI: build bundled versions
ADIOS2_DIR   = BUILD
OPENPMD_DIR  = BUILD
YAML_CPP_DIR = BUILD
NSIMD_DIR    = BUILD
SSHT_DIR     = BUILD
