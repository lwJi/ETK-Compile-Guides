# Whenever this version string changes, the application is configured
# and rebuilt from scratch.

VERSION = deltaai-2026-07-29-gh200

CPP  = cpp
FPP  = cpp
CC   = cc
CXX  = CC
F90  = ftn
CUCC = nvcc

# Set LD instead of LDFLAGS so ExternalLibraries do not inherit CUDA-only
# compilation options.
LD = nvcc --compiler-bindir g++ -g --forward-unknown-to-host-compiler --relocatable-device-code=true --objdir-as-tempdir -flto

CPPFLAGS = -DSIMD_CPU
FPPFLAGS = -traditional -march=native
# Do not add -std=gnu99 or -std=c99 below; that causes nvcc to fail while
# linking C utilities. GCC on DeltaAI defaults to a sufficiently new C mode.
CFLAGS    = -pipe -g -D_GNU_SOURCE -fomit-frame-pointer
CXXFLAGS  = -pipe -g -std=c++17 -D_GNU_SOURCE -fomit-frame-pointer
F90FLAGS  = -pipe -g -fcray-pointer -ffixed-line-length-none -fno-range-check -march=native -fomit-frame-pointer
CUCCFLAGS = -pipe -g --compiler-options -march=native -std=c++17 --compiler-options -std=gnu++17 --expt-relaxed-constexpr --extended-lambda --gpu-architecture sm_90 --forward-unknown-to-host-compiler --Werror ext-lambda-captures-this --relocatable-device-code=true --objdir-as-tempdir -x cu

LIBS = gfortran curand mpi_gtl_cuda
LIBDIRS = /opt/nvidia/hpc_sdk/Linux_aarch64/25.5/cuda/12.9/lib64 /opt/nvidia/hpc_sdk/Linux_aarch64/25.5/math_libs/12.9/targets/sbsa-linux/lib
C_LINE_DIRECTIVES = yes
F_LINE_DIRECTIVES = yes

VECTORISE                = yes
VECTORISE_ALIGNED_ARRAYS = yes
VECTORISE_INLINE         = yes

DEBUG            = no
CPP_DEBUG_FLAGS  = -g3 -DCARPET_DEBUG
FPP_DEBUG_FLAGS  = -g3 -DCARPET_DEBUG
C_DEBUG_FLAGS    = -g3 -ftrapv -fstack-protector-all -fbounds-check
CXX_DEBUG_FLAGS  = -g3 -ftrapv -fstack-protector-all -fbounds-check
CUCC_DEBUG_FLAGS = -g3
F90_DEBUG_FLAGS  = -g3 -ftrapv -fstack-protector-all -fcheck=bounds,do,mem,pointer,recursion -finit-character=65 -finit-integer=42424242 -finit-real=nan
LD_DEBUG_FLAGS   = -g3

OPTIMISE            = yes
CPP_OPTIMISE_FLAGS  = # -DCARPET_OPTIMISE -DNDEBUG
FPP_OPTIMISE_FLAGS  = # -DCARPET_OPTIMISE -DNDEBUG
C_OPTIMISE_FLAGS    = -O3
CUCC_OPTIMISE_FLAGS = -O3
CXX_OPTIMISE_FLAGS  = -O3
F90_OPTIMISE_FLAGS  = -O3

PROFILE           = no
CPP_PROFILE_FLAGS =
FPP_PROFILE_FLAGS =
C_PROFILE_FLAGS   = -pg
CXX_PROFILE_FLAGS = -pg
F90_PROFILE_FLAGS = -pg

# The validated CUDA configuration does not compile Cactus with OpenMP.
# SimFactory still reserves 72 Grace cores per GPU rank for affinity and
# host-side library work.
OPENMP           = no
CPP_OPENMP_FLAGS = -fopenmp
FPP_OPENMP_FLAGS = -fopenmp
C_OPENMP_FLAGS   = -fopenmp
CXX_OPENMP_FLAGS = -fopenmp
F90_OPENMP_FLAGS = -fopenmp
LD_OPENMP_FLAGS  = -fopenmp

WARN            = no
CPP_WARN_FLAGS  = -Wall
FPP_WARN_FLAGS  = -Wall
C_WARN_FLAGS    = -Wall
CXX_WARN_FLAGS  = -Wall
CUCC_WARN_FLAGS = -Xcompiler -Wall
F90_WARN_FLAGS  = -Wall

DISABLE_INT16  = yes
DISABLE_REAL16 = yes

AMREX_ENABLE_CUDA = yes
AMREX_CMAKE_CUDA_ARCHITECTURES = 90

MPI_DIR      = /opt/cray/pe/mpich/9.0.1/ofi/gnu/12.3
MPI_INC_DIRS = /opt/cray/pe/mpich/9.0.1/ofi/gnu/12.3/include
MPI_LIB_DIRS = /opt/cray/pe/mpich/9.0.1/ofi/gnu/12.3/lib
MPI_LIBS     = mpi

HWLOC_DIR      = /usr
HWLOC_INC_DIRS = /usr/include
HWLOC_LIB_DIRS = /usr/lib64

BLAS_DIR     = ${OPENBLAS_HOME}/lib
LAPACK_DIR   = ${OPENBLAS_HOME}/lib
OPENBLAS_DIR = ${OPENBLAS_HOME}/lib
BLAS_LIBS     = openblas
LAPACK_LIBS   = openblas
OPENBLAS_LIBS = openblas

BOOST_DIR = BUILD
FFTW3_DIR = ${FFTW_ROOT}
GSL_DIR = ${GSL_HOME}
HDF5_DIR = ${HDF5_ROOT}
